<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Ultra Pro Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="aiStatusToast">✨ Quantum AI Engine Active</div>

    <div class="app-container">
        <!-- Top Pro Header -->
        <div class="top-header">
            <div class="logo-area">
                <span class="logo-icon">⚡</span>
                <span class="logo-title">QUANTUM STUDIO PRO</span>
            </div>
            <div class="header-actions">
                <button class="pro-btn upload-btn" onclick="document.getElementById('fileInputUploader').click()">📂 Open Media</button>
                <input type="file" id="fileInputUploader" accept="image/*,video/*" style="display:none;" onchange="handleFileLoad(this)">
                <button class="pro-btn export-btn" onclick="saveMasterpiece()">💾 Export HD</button>
            </div>
        </div>

        <!-- Main Workspace / Viewport -->
        <div class="workspace" id="workspaceContainer">
            <video id="liveCameraFeed" autoplay playsinline style="display:none;"></video>
            <canvas id="canvasViewport"></canvas>

            <!-- Advanced Camera HUD & Zoom Slider -->
            <div id="cameraHudOverlay" style="display:none;">
                <div class="hud-top">
                    <span id="nightVisionBadge" class="hud-badge active">🌙 Night Sight: AUTO</span>
                    <span id="fpsBadge" class="hud-badge">60 FPS 4K</span>
                </div>
                <div class="hud-zoom-box">
                    <span>Zoom: <strong id="zoomVal">1.0x</strong></span>
                    <input type="range" id="zoomSlider" min="1" max="50" value="1" step="0.5" oninput="applyLiveZoom(this.value)">
                </div>
            </div>
        </div>

        <!-- CapCut Style Bottom Timeline & Tools Tray -->
        <div class="pro-control-dock">
            <!-- Mode Tabs (Primary Categories) -->
            <div class="dock-tabs">
                <button class="dock-tab active" onclick="switchDockMode('camera', this)">📷 Camera & Moon</button>
                <button class="dock-tab" onclick="switchDockMode('ai-hdr', this)">✨ AI DSLR & HDR</button>
                <button class="dock-tab" onclick="switchDockMode('night-sight', this)">🌙 Night Sight</button>
                <button class="dock-tab" onclick="switchDockMode('retouch', this)">🪄 Magic Retouch</button>
                <button class="dock-tab" onclick="switchDockMode('reels', this)">🔥 Reels Text</button>
            </div>

            <!-- Contextual Tools Row -->
            <div class="dock-tools-row" id="toolsRowContainer">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
